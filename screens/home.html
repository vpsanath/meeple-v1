<!-- Screen 2: Home / Events -->
<section id="homeScreen" class="screen hidden">
    <header class="dashboard-header">
        <div class="user-greeting">
            <div class="profile-header">
                <div class="greeting-text">
                    <h2>Bonjour ! 👋</h2>
                    <p>Prêt pour une partie ?</p>
                </div>
                <img id="userAvatar" src="https://i.pravatar.cc/150?u=u1" alt="Profile" class="profile-pic">
            </div>
        </div>
    </header>
    <main class="dashboard-main">
        <div class="section-header">
            <h3>Événements à venir</h3>
        </div>
        <div id="eventsList" class="events-list">
            <!-- Events will be mapped here -->
        </div>
    </main>
    <button id="addEventBtn" class="fab-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>
</section>
